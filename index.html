<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Decimi, Centesimi e Millesimi Master Antonio Iemma 🎓</title>
    <style>
        :root {
            --primary: #4a90e2; --secondary: #f39c12; --success: #2ecc71;
            --danger: #e74c3c; --bg: #f4f7f6; --text: #2c3e50; --accent: #9b59b6; --milli: #1abc9c;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 900px; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        
        .header-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .sticker { 
            width: 120px; 
            height: auto; 
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            animation: bounce 3s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .main-title { color: var(--primary); margin: 0; font-size: 1.8rem; }
        .author-tag { color: var(--secondary); font-weight: bold; font-size: 1.2rem; margin-top: 5px; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; border-bottom: 5px solid var(--primary); }
        .card:hover { transform: translateY(-5px); }

        .game-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; min-height: 450px; }
        
        .grid-decimi { display: flex; width: 300px; height: 50px; border: 2px solid #333; margin: 20px auto; }
        .cell-decimo { flex: 1; border: 1px solid #ccc; }
        .grid-centesimi { display: grid; grid-template-columns: repeat(10, 1fr); width: 220px; height: 220px; border: 2px solid #333; margin: 20px auto; gap: 1px; background: #333;}
        .cell-centesimo { background: white; }
        .millesimi-container { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 500px; margin: 20px auto; }
        .mille-block { width: 40px; height: 40px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 0.5px; background: #ddd; }
        .mille-cell { background: white; }
        
        .filled { background-color: var(--primary) !important; }
        .filled-alt { background-color: var(--accent) !important; }
        .filled-milli { background-color: var(--milli) !important; }

        .line-container { width: 90%; height: 60px; margin: 50px auto; position: relative; border-top: 3px solid #333; }
        .tick { position: absolute; width: 2px; height: 15px; background: #333; top: -1px; }
        .tick.major { height: 25px; width: 3px; }
        .tick-label { position: absolute; top: 30px; transform: translateX(-50%); font-weight: bold; font-size: 0.9rem; }
        .marker { position: absolute; width: 24px; height: 24px; background: var(--danger); border-radius: 50%; top: -13px; transform: translateX(-50%); cursor: grab; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; transition: left 0.1s; }

        .input-area { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        input { width: 85px; padding: 10px; font-size: 1.2rem; text-align: center; border: 2px solid #ddd; border-radius: 8px; }
        .line { width: 60px; height: 2px; background: #333; margin: 5px 0; }
        button { padding: 12px 25px; font-size: 1rem; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; }
        .btn-check { background: var(--success); color: white; }
        .btn-next { background: var(--secondary); color: white; }
        .btn-back { position: absolute; left: 10px; top: 10px; background: #eee; padding: 5px 12px; }
    </style>
</head>
<body>

    <div id="menu-screen" class="container">
        <div class="header-container">
            <img src="mascotte.png" alt="Mascotte Antonio Iemma" class="sticker">
            <h1 class="main-title">Laboratorio Decimi, Centesimi e Millesimi</h1>
            <div class="author-tag">Master Antonio Iemma</div>
        </div>

        <div class="menu-grid">
            <div class="card" onclick="startApp(1)"><h3>I Decimi</h3><p>1 / 10</p></div>
            <div class="card" onclick="startApp(2)" style="border-bottom-color: var(--accent);"><h3>I Centesimi</h3><p>1 / 100</p></div>
            <div class="card" onclick="startApp(3)" style="border-bottom-color: var(--milli);"><h3>I Millesimi</h3><p>1 / 1000</p></div>
            <div class="card" onclick="startApp(4)" style="border-bottom-color: var(--danger);"><h3>La Linea</h3><p>Esercizi</p></div>
        </div>
    </div>

    <div id="game-screen" class="container hidden">
        <div class="game-box">
            <button class="btn-back" onclick="location.reload()">⬅ Menu</button>
            <h2 id="title"></h2>
            <div id="visual-area"></div>
            
            <div id="input-ui" class="input-area">
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <input type="number" id="num-in" placeholder="Num.">
                    <div class="line"></div>
                    <input type="number" id="den-in" readonly>
                </div>
                <div style="font-size: 2rem;">=</div>
                <input type="text" id="dec-in" placeholder="0,0" style="width: 110px;">
            </div>

            <div id="feedback" style="margin-top: 20px; font-weight: bold;"></div>
            <button id="check-btn" class="btn-check" onclick="check()">Controlla ✅</button>
            <button id="next-btn" class="btn-next hidden" onclick="generate()">Prossima ➡️</button>
        </div>
    </div>

    <script>
        let mode = 0; let target = 0;

        function startApp(m) {
            mode = m;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            generate();
        }

        function generate() {
            const area = document.getElementById('visual-area');
            const inputUI = document.getElementById('input-ui');
            const feedback = document.getElementById('feedback');
            area.innerHTML = ''; feedback.innerHTML = '';
            document.getElementById('num-in').value = ''; 
            document.getElementById('dec-in').value = '';
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('check-btn').classList.remove('hidden');
            inputUI.classList.remove('hidden');

            if (mode === 1) {
                target = Math.floor(Math.random() * 9) + 1;
                document.getElementById('title').innerText = "Rappresenta i Decimi";
                document.getElementById('den-in').value = 10;
                let html = '<div class="grid-decimi">';
                for(let i=0; i<10; i++) html += `<div class="cell-decimo ${i < target ? 'filled' : ''}"></div>`;
                area.innerHTML = html + '</div>';
            } else if (mode === 2) {
                target = (Math.floor(Math.random() * 9) + 1) * 10;
                document.getElementById('title').innerText = "Rappresenta i Centesimi";
                document.getElementById('den-in').value = 100;
                let html = '<div class="grid-centesimi">';
                for(let i=0; i<100; i++) html += `<div class="cell-centesimo ${i < target ? 'filled-alt' : ''}"></div>`;
                area.innerHTML = html + '</div>';
            } else if (mode === 3) {
                target = (Math.floor(Math.random() * 5) + 1) * 100;
                document.getElementById('title').innerText = "Rappresenta i Millesimi";
                document.getElementById('den-in').value = 1000;
                let html = '<div class="millesimi-container">';
                for(let b=0; b<10; b++) {
                    html += '<div class="mille-block">';
                    for(let c=0; c<100; c++) html += `<div class="mille-cell ${(b*100+c) < target ? 'filled-milli' : ''}"></div>`;
                    html += '</div>';
                }
                area.innerHTML = html + '</div>';
            } else {
                inputUI.classList.add('hidden');
                document.getElementById('title').innerText = "Trascina il pallino rosso";
                target = (Math.floor(Math.random() * 11) + 30) / 10; // Da 3,0 a 4,0
                
                let lineHTML = `<p style='font-size:1.5rem'>Trova: <b>${target.toFixed(1).replace('.',',')}</b></p>`;
                lineHTML += `<div class="line-container" id="line">`;
                for(let i=0; i<=10; i++) {
                    let pos = i * 10;
                    let label = (3 + i/10).toFixed(1).replace('.',',');
                    lineHTML += `<div class="tick major" style="left:${pos}%"></div>`;
                    lineHTML += `<div class="tick-label" style="left:${pos}%">${label}</div>`;
                }
                lineHTML += `<div class="marker" id="marker" style="left:0%"></div></div>`;
                area.innerHTML = lineHTML;
                setupDrag();
            }
        }

        function setupDrag() {
            const marker = document.getElementById('marker');
            const line = document.getElementById('line');
            let isDragging = false;

            const move = (e) => {
                if(!isDragging) return;
                let rect = line.getBoundingClientRect();
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let x = clientX - rect.left;
                let pct = Math.max(0, Math.min(100, (x / rect.width) * 100));
                let snapPct = Math.round(pct / 10) * 10;
                marker.style.left = snapPct + '%';
            };

            marker.onmousedown = marker.ontouchstart = (e) => { isDragging = true; e.preventDefault(); };
            window.onmousemove = window.ontouchmove = move;
            window.onmouseup = window.ontouchend = () => isDragging = false;
        }

        function check() {
            const f = document.getElementById('feedback');
            let ok = false;
            if(mode === 4) {
                let currentPos = 3 + (parseInt(document.getElementById('marker').style.left) / 10);
                ok = Math.abs(currentPos - target) < 0.01;
            } else {
                const num = parseInt(document.getElementById('num-in').value);
                const dec = document.getElementById('dec-in').value.replace(',', '.');
                let correctDec = (target / document.getElementById('den-in').value);
                ok = (num === target && Math.abs(parseFloat(dec) - correctDec) < 0.0001);
            }
            if(ok) {
                f.innerHTML = "🌟 Bravissimo!"; f.style.color = "var(--success)";
                document.getElementById('check-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                f.innerHTML = "❌ Riprova!"; f.style.color = "var(--danger)";
            }
        }
    </script>
</body>
</html>
